<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aaradhya Seeds — Catalogue Studio</title>
  <meta name="description" content="Manage seed products, build catalogues, and generate print-ready PDFs for Aaradhya Seeds." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img class="sidebar-brand-logo" src="images/aaradhya-seeds-logo.png" alt="Aaradhya Seeds" />
      <span class="sidebar-brand-sub">CATALOGUE STUDIO</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="overview" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"/></svg>
        Overview
      </a>

      <div class="nav-section-label">MANAGE</div>

      <a class="nav-item" data-page="seed-master" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zm-2 4a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
        Seed Master
      </a>

      <a class="nav-item" data-page="catalogue-builder" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/></svg>
        Catalogue Builder
      </a>

      <a class="nav-item" data-page="page-artwork" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/></svg>
        Page Artwork
      </a>

      <div class="nav-section-label">OUTPUT</div>

      <a class="nav-item" data-page="preview" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
        Preview Catalogue
      </a>

      <a class="nav-item" data-page="generate" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v3.586L7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd"/></svg>
        Generate PDF
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="footer-help">
        <span>Need help?</span>
        <a href="#">Catalogue support</a>
      </div>
      <button class="btn-logout">Log out</button>
    </div>
  </aside>

  <!-- ====== MAIN ====== -->
  <main class="main-content" id="main-content">
    <!-- Pages rendered by JS -->
    <div id="page-container"></div>
  </main>

  <!-- ====== MODAL: Add / Edit Seed ====== -->
  <div class="modal-overlay" id="seed-modal" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Add New Seed</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Seed / Variety Name *</label>
            <input type="text" id="f-name" placeholder="e.g. AHP Wonder-68" />
          </div>
          <div class="form-group">
            <label>Code</label>
            <input type="text" id="f-code" placeholder="e.g. AHP-68" />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="f-category">
              <option value="">Select category</option>
              <option>Hybrid Paddy</option>
              <option>Improved Paddy</option>
              <option>Other Paddy</option>
              <option>TL/Certified Paddy</option>
              <option>Maize</option>
              <option>Wheat</option>
              <option>Moong</option>
              <option>Mustard</option>
              <option>Urad</option>
              <option>Arhar</option>
              <option>Vegetable Crops</option>
              <option>Forage Crops</option>
            </select>
          </div>
          <div class="form-group">
            <label>Duration (Days)</label>
            <input type="text" id="f-duration" placeholder="e.g. 115–120 दिन" />
          </div>
          <div class="form-group">
            <label>Grain Type (दाना)</label>
            <input type="text" id="f-grain" placeholder="e.g. मोटा दाना" />
          </div>
          <div class="form-group">
            <label>Soil / Water (जलीय)</label>
            <input type="text" id="f-soil" placeholder="e.g. मध्यम/भारी" />
          </div>
          <div class="form-group full-width">
            <label>Description / Features (विशेषता)</label>
            <textarea id="f-desc" rows="3" placeholder="Key features and characteristics..."></textarea>
          </div>
          <div class="form-group full-width">
            <label>Product Image</label>
            <div class="product-image-control">
              <div class="product-image-preview" id="f-image-preview"><span>🌱</span></div>
              <div class="product-image-actions">
                <label class="file-input-label" for="f-image-file">📁 Choose Product Image</label>
                <input class="file-input-hidden" type="file" id="f-image-file" accept="image/*" onchange="handleProductImageUpload(this)" />
                <span class="file-name-label" id="f-image-file-name">No image selected</span>
                <input type="text" id="f-image" placeholder="Paste image URL or project path" oninput="updateProductImagePreview(this.value)" />
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Layout Size</label>
            <select id="f-layout">
              <option>FULL PAGE</option>
              <option>HALF PAGE</option>
              <option>AUTO</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="f-status">
              <option>PUBLISHED</option>
              <option>DRAFT</option>
              <option>ARCHIVED</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button class="btn-primary" id="modal-save-btn">Save Seed</button>
      </div>
    </div>
  </div>

  <!-- Dedicated Print Container for PDF export -->
  <div id="print-area"></div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast"></div>

  <script src="html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
